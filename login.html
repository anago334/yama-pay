<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>やまPayログイン</title>
  <style>
    :root {
      --blue: #0aa0ff;
      --blue-dark: #008edd;
      --bg: #ffffff;
      font-family: "Hiragino Kaku Gothic ProN", Meiryo, "Noto Sans JP", sans-serif;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--blue-dark);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: var(--font-family);
    }

    .login-box {
      text-align: center;
      padding: 24px;
      border: 6px solid var(--blue); /* 他画面と揃えた枠の太さと色 */
      border-radius: 24px;
      background: #dff5ff; /* メイン画面のカード背景と統一 */
      width: 350px;
      box-sizing: border-box;
    }

  .login-box input {
    margin-bottom: 16px;
  }

    h1 {
      color: var(--blue-dark); /* タイトル色を統一 */
      margin-bottom: 16px;
    }

    input {
      padding: 8px 12px;
      font-size: 18px;
      margin-bottom: 12px;
      width: 100%;
      box-sizing: border-box;
      border: 2px solid var(--blue);
      border-radius: 8px;
      text-align: center;
    }

    button {
      padding: 10px 20px;
      font-size: 18px;
      cursor: pointer;
      background: var(--blue);
      color: #fff;
      border: none;
      border-radius: 8px;
      width: 100%;
      box-sizing: border-box;
    }
    
   /* ハードモード切替ゾーン（右上50px四方） */
  .secret-zone {
    position: fixed;
    top: 0;
    right: 0;
    width: 50px;
    height: 50px;
    opacity: 0; /* 透明にして見えない */
    z-index: 999;
  }
  
  </style>
</head>
<body>
 <div class="login-box">
   <h1>やまPay ログイン</h1>
   <input type="text" id="username" placeholder="ユーザー名" value="">
   <button id="btnLogin">ログイン</button>
 </div>

  <!-- ハードモード用の透明タップゾーン -->
  <div id="secretZone" class="secret-zone"></div>

  <script>
      let tapCount = 0;
      let isSecret = false;
      const secretZone = document.getElementById("secretZone");
      const usernameInput = document.getElementById("username");
      const btnLogin = document.getElementById("btnLogin");

  function doLogin() {
    const username = usernameInput.value.trim();
    if (username === "") {
      alert("ユーザー名を入力してください");
      return;
    }
    window.location.href = "yamapay_ver3.html?user=" + encodeURIComponent(username);
  }
  
  // 秘密のタップカウント
  secretZone.addEventListener("click", () => {
  tapCount++;

  if (tapCount === 5) {
    alert("あと2回でハードモードに入れます…！");
  }

  if (tapCount === 7) {
    isSecret = true;
    alert("ハードモード突入！");
    localStorage.setItem("yamapaySecretMode", "true"); // ローカルに保存
  }
});

  // ログインしたら裏モードは封印
  btnLogin.addEventListener("click", () => {
    secretZone.remove(); // タップゾーンを削除
  });

  btnLogin.addEventListener("click", doLogin);

  // Enterキーでログイン
  usernameInput.addEventListener("keydown", (event) => {
    if (event.key === "Enter") {
      doLogin();
    }
  });
  </script>
</body>
</html>
